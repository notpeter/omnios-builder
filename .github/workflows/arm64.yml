name: Experimental arm64
on:
  workflow_dispatch:
  push:
    branches: [illumos_aarch64]
    paths:
      - '.github/workflows/arm64.yml'
permissions:
  contents: read
concurrency:
  group: experimental-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build experimental r151059 image
        run: python3 build.py conf/omnios-r151059-aarch64.conf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnios-r151059-aarch64
          path: |
            build/omnios-r151059-aarch64*
            build/omnios-aarch64-u-boot.bin
            build/*.log
            build/*.cmdline
          retention-days: 3
          compression-level: 0
